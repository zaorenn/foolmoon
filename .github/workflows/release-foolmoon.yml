name: Build & Release Foolmoon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          ./installer/build-setup.ps1
          ./installer/dist/Foolmoon-Setup.exe --version
          ./installer/dist/Foolmoon-Setup.exe --self-test

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/Foolmoon-Setup.exe
            installer/dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
